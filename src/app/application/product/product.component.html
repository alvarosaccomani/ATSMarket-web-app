<form nz-form [formGroup]="productForm" nzLayout="vertical">

    <div nz-row [nzGutter]="16">
        <div nz-col nzSpan="8">
            <nz-form-item>
                <nz-form-label>Código Maestro</nz-form-label>
                <input nz-input formControlName="pro_code" />
            </nz-form-item>
        </div>
        <div nz-col nzSpan="16">
            <nz-form-item>
                <nz-form-label>Nombre del Producto</nz-form-label>
                <input nz-input formControlName="pro_name" />
            </nz-form-item>
        </div>
    </div>

    <nz-divider nzText="Variaciones de Producto (SKUs)"></nz-divider>

    <div formArrayName="productVariations">
        <nz-table #varTable [nzData]="productVariations.controls" [nzFrontPagination]="false" nzSize="small">
            <thead>
                <tr>
                    <th>Código/SKU</th>
                    <th>Nombre/Descripcion</th>
                    <th>Color/Talla</th>
                    <th>Stock</th>
                    <th>Precio Sugerido</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody>
                @for (control of productVariations.controls; track control; let i = $index) {
                <tr [formGroupName]="i">
                    <td>
                        <input nz-input formControlName="prov_code" placeholder="Cod"
                            style="width: 80px; margin-bottom: 4px;" />
                        <input nz-input formControlName="prov_sku" placeholder="SKU" />
                    </td>
                    <td>
                        <input nz-input formControlName="prov_name" placeholder="Nombre" style="margin-bottom: 4px;" />
                        <input nz-input formControlName="prov_description" placeholder="Descripcion" />
                    </td>
                    <td>
                        <input nz-input formControlName="prov_color" placeholder="Color" style="margin-bottom: 4px;" />
                        <input nz-input formControlName="prov_size" placeholder="Talla/Medida" />
                    </td>
                    <td>
                        <nz-input-number formControlName="prov_stock" [nzMin]="0"></nz-input-number>
                    </td>
                    <td>
                        <nz-input-number formControlName="prov_suggestedminimumsellingprice"
                            [nzMin]="0"></nz-input-number>
                    </td>
                    <td>
                        <button nz-button nzType="text" (click)="editVariationDetails(i)" nz-tooltip
                            nzTooltipTitle="Edición avanzada">
                            <nz-icon nzType="edit" nzTheme="outline" />
                        </button>
                        <button nz-button nzType="text" nzDanger (click)="removeVariation(i)">
                            <span nz-icon nzType="delete"></span>
                        </button>
                    </td>
                </tr>
                }
            </tbody>
        </nz-table>
    </div>

    <button nz-button nzType="dashed" nzBlock (click)="addVariation()" style="margin-top: 16px;">
        <span nz-icon nzType="plus"></span> Añadir otra variación (Color, Talla, etc.)
    </button>

    <div class="form-footer">
        <nz-space>
            <button *nzSpaceItem nz-button nzType="default" (click)="onCancel()">
                Cancelar
            </button>
            <button *nzSpaceItem nz-button nzType="primary" (click)="onSave()" [disabled]="productForm.invalid">
                Guardar Producto y Variaciones
            </button>
        </nz-space>
    </div>

</form>
