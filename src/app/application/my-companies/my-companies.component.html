<div class="my-companies-container">
    <div class="header-actions"
        style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
        <div>
            <h2>Tus Tiendas (Modo Administrador)</h2>
            <p>Selecciona una empresa para gestionar sus productos y configuraciones.</p>
        </div>
        <button nz-button nzType="primary" nzSize="large" (click)="createNewCompany()">
            <span nz-icon nzType="plus"></span> Añadir Empresa
        </button>
    </div>

    <div nz-row [nzGutter]="[16, 16]">
        <div nz-col [nzXs]="24" [nzSm]="12" [nzMd]="8" [nzLg]="6" *ngFor="let company of userRolesCompany">
            <nz-card nzHoverable [nzBordered]="true" class="company-card" (click)="selectCompany(company)">
                <div class="company-logo">
                    <!-- TODO: aquí puedes reemplazar el avatar por un img si las tiendas tienen logo -->
                    <nz-avatar [nzSize]="64" nzIcon="shop" class="company-avatar"></nz-avatar>
                </div>
                <div class="company-info">
                    <h3>{{ company.cmp_name }}</h3>

                    <div class="company-roles">
                        <span *ngFor="let role of company.roles" class="role-badge">
                            {{ role.rol_name }}
                        </span>
                    </div>
                </div>

                <div class="company-action" style="display: flex; gap: 8px;">
                    <button nz-button nzType="default" nzTooltipTitle="Editar Info" nz-tooltip
                        *ngIf="isAdmin(company.roles)"
                        (click)="editCompany(company.cmp_uuid); $event.stopPropagation()">
                        <span nz-icon nzType="edit"></span>
                    </button>
                    <button nz-button nzType="default" nzTooltipTitle="Ajustes de Empresa" nz-tooltip
                        *ngIf="isAdmin(company.roles)"
                        (click)="settingsCompany(company.cmp_uuid); $event.stopPropagation()">
                        <span nz-icon nzType="setting"></span>
                    </button>
                    <button nz-button nzType="default" nzTooltipTitle="Asignar Roles/Usuarios" nz-tooltip
                        *ngIf="isAdmin(company.roles)"
                        (click)="userRolCompany(company.cmp_uuid); $event.stopPropagation()">
                        <span nz-icon nzType="usergroup-add"></span>
                    </button>
                    <button nz-button nzType="primary" style="flex: 1;"
                        (click)="selectCompany(company); $event.stopPropagation()">
                        Gestionar <span nz-icon nzType="arrow-right"></span>
                    </button>
                </div>
            </nz-card>
        </div>
    </div>

    <div class="no-companies" *ngIf="userRolesCompany?.length === 0">
        <nz-empty nzNotFoundContent="No tienes ninguna tienda asignada."></nz-empty>
    </div>
</div>
