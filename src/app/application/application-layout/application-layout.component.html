<nz-layout>
    <nz-sider nzCollapsible [nzTrigger]="null" nzBreakpoint="md" [nzCollapsedWidth]="0" [(nzCollapsed)]="isCollapsed"
        [nzTrigger]="null">
        <div class="logo"></div>
        <ul nz-menu nzTheme="dark" nzMode="inline">
            <ng-container *ngFor="let item of menuItems">
                <!-- Simple Menu Item (Level 1) -->
                <li nz-menu-item *ngIf="(!item.items || item.items.length === 0) && (!item.mnu_showifcompanyactive || activeCompany)"
                    [routerLink]="item.mnu_showifcompanyactive ? [item.mnu_route, activeCompany?.cmp_uuid] : item.mnu_route">
                    <span nz-icon [nzType]="item.mnu_icon!" *ngIf="item.mnu_icon"></span>
                    <span>{{ item.mnu_title }}</span>
                </li>

                <!-- Submenu (Level 1) -->
                <li nz-submenu *ngIf="item.items && item.items.length > 0 && (!item.mnu_showifcompanyactive || activeCompany)" 
                    [nzTitle]="item.mnu_title!" [nzIcon]="item.mnu_icon!">
                    <ul>
                        <ng-container *ngFor="let child of item.items">
                            <li nz-menu-item *ngIf="!child.mnu_showifcompanyactive || activeCompany"
                                [routerLink]="child.mnu_showifcompanyactive ? [child.mnu_route, activeCompany?.cmp_uuid] : child.mnu_route">
                                <span nz-icon [nzType]="child.mnu_icon!" *ngIf="child.mnu_icon"></span>
                                <span>{{ child.mnu_title }}</span>
                            </li>
                        </ng-container>
                    </ul>
                </li>
            </ng-container>
        </ul>
    </nz-sider>
    <nz-layout>
        <nz-header style="display: flex; flex-direction: row; align-items: center; justify-content: space-between;">
            <nz-icon class="trigger" [nzType]="isCollapsed ? 'menu-unfold' : 'menu-fold'"
                (click)="isCollapsed = !isCollapsed" />
            <div class="header-right" style="display: flex; align-items: center; gap: 24px; padding-right: 24px;">

                <!-- Botón de Acceso Directo de Configuración -->
                <button nz-button nzType="text" nzShape="circle" style="background-color: #f5f5f5;"
                    nzTooltipTitle="Ajustes de mi Empresa" nz-tooltip
                    [routerLink]="['/application/company-settings', activeCompany?.cmp_uuid]" *ngIf="activeCompany">
                    <span nz-icon nzType="setting" nzTheme="outline" style="font-size: 18px;"></span>
                </button>

                <!-- Menú Desplegable de Tienda Activa -->
                <a nz-dropdown [nzDropdownMenu]="companyMenu" class="company-selector"
                    style="color: black; font-size: 16px; display: flex; align-items: center; cursor: pointer;">
                    <span nz-icon nzType="shop" style="margin-right: 8px;"></span>
                    <span>{{ activeCompany?.cmp_name || 'Seleccionar Tienda' }}</span>
                    <span nz-icon nzType="down" style="margin-left: 8px; font-size: 12px;"></span>
                </a>

                <nz-dropdown-menu #companyMenu="nzDropdownMenu">
                    <ul nz-menu>
                        <li nz-menu-item *ngFor="let company of userRolesCompany" (click)="selectCompany(company)">
                            <span nz-icon nzType="shop" style="margin-right: 8px;"></span> {{ company.cmp_name }}
                        </li>
                        <li nz-menu-divider *ngIf="userRolesCompany.length > 0"></li>
                        <li nz-menu-item routerLink="/application/my-companies">
                            <span nz-icon nzType="appstore" style="margin-right: 8px;"></span> Ver todas mis tiendas
                        </li>
                    </ul>
                </nz-dropdown-menu>

                <div class="user-profile" style="display: flex; align-items: center; gap: 8px;">
                    <a nz-dropdown [nzDropdownMenu]="userMenu"
                        style="color: black; display: flex; align-items: center; gap: 8px; cursor: pointer;">
                        <span class="user-name">Hola, {{ userIdentity?.usr_name || 'Usuario' }}</span>
                        <nz-avatar nzIcon="user" nzSrc="assets/img/user-avatar.png"></nz-avatar>
                    </a>
                    <nz-dropdown-menu #userMenu="nzDropdownMenu">
                        <ul nz-menu>
                            <li nz-menu-item>
                                <span nz-icon nzType="user" style="margin-right: 8px;"></span> Mi Perfil
                            </li>
                            <li nz-menu-item *ngIf="activeCompany"
                                [routerLink]="['/application/company-settings', activeCompany?.cmp_uuid]">
                                <span nz-icon nzType="setting" style="margin-right: 8px;"></span> Configuración de la
                                Empresa
                            </li>
                            <li nz-menu-divider></li>
                            <li nz-menu-item nzDanger (click)="logout()">
                                <span nz-icon nzType="logout" style="margin-right: 8px;"></span> Cerrar sesión
                            </li>
                        </ul>
                    </nz-dropdown-menu>
                </div>
            </div>
        </nz-header>
        <nz-content>
            <nz-breadcrumb style="margin:16px 0;">
                <nz-breadcrumb-item *ngFor="let crumb of breadcrumbs">{{ crumb }}</nz-breadcrumb-item>
            </nz-breadcrumb>
            <router-outlet></router-outlet>
        </nz-content>
        <nz-footer>Implement By ATS</nz-footer>
    </nz-layout>
</nz-layout>
