<div class="header-actions">
    <h2>Gestión de Inventario</h2>
    <button nz-button nzType="primary" (click)="abrirModalNuevo()">
        <span nz-icon nzType="plus"></span> Nuevo Producto
    </button>
</div>

<nz-table #basicTable [nzData]="misProductos" [nzBordered]="true">
    <thead>
        <tr>
            <th>Producto / Ref</th>
            <th>Tienda</th>
            <th>Rubro / Categoría</th>
            <th>Costo (ARS)</th>
            <th>Precio Venta</th>
            <th>Stock</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody>
        <tr *ngFor="let data of basicTable.data">
            <td>
                <strong>{{ data.nombre }}</strong><br>
                <small>{{ data.referencia }}</small>
            </td>
            <td>{{ data.nombreTienda }}</td>
            <td>
                <nz-tag nzColor="blue">{{ data.rubro }}</nz-tag><br>
                <small>{{ data.categoria }}</small>
            </td>
            <td>$ {{ data.costo }}</td>
            <td><strong style="color: #52c41a;">$ {{ data.precio }}</strong></td>
            <td>
                <nz-tag [nzColor]="data.stock < 5 ? 'red' : 'green'">
                    {{ data.stock }} unidades
                </nz-tag>
            </td>
            <td>
                <button nz-button nzType="text" nzShape="circle"><span nz-icon nzType="edit"></span></button>
                <button nz-button nzType="text" nzDanger nzShape="circle"><span nz-icon nzType="delete"></span></button>
            </td>
        </tr>
    </tbody>
</nz-table>
