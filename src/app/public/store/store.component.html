<div *ngIf="store; else notFound" class="store-page-wrapper">

    <div class="store-header-banner">
        <img [src]="store.cmp_logo" [alt]="store.cmp_name" class="store-logo">
        <h1 class="store-name">{{ store.cmp_name }}</h1>
        <p class="store-description">{{ store.cmp_description }}</p>
        <!-- TODO: Implementar rubro de tienda -->
        <!-- <p class="store-rubro">Rubro: {{ store.rubroPersonalizado }}</p> -->
    </div>

    <nz-layout class="store-catalogo-layout">

        <nz-sider [nzWidth]="250" nzCollapsible [nzBreakpoint]="'md'" [nzCollapsedWidth]="0"
            class="store-filters-sidebar">
            <div class="store-filters-container">
                <h3><span nz-icon nzType="filter"></span> Filtrar en {{ store.cmp_name }}</h3>

                <nz-divider></nz-divider>

                <!-- TODO: Ver como se implementan los filtros-->

                <!-- <div class="filter-group">
                    <h4>Categoría Personalizada</h4>
                    <nz-select [(ngModel)]="selectedCategory" (ngModelChange)="applyFilters()"
                        nzPlaceHolder="Todas las categorías">
                        <nz-option [nzLabel]="'Todos'" [nzValue]="null"></nz-option>
                        <nz-option *ngFor="let cat of store.categoriasPersonalizadas" [nzLabel]="cat"
                            [nzValue]="cat"></nz-option>
                    </nz-select>
                </div> -->

                <nz-divider></nz-divider>

            </div>
        </nz-sider>

        <nz-content class="store-products-grid">
            <h2 class="store-products-grid-title">{{ filteredProducts.length }} Artículos de {{ store.cmp_name }}</h2>

            <div nz-row [nzGutter]="[16, 16]">
                <div *ngIf="filteredProducts.length === 0" class="store-no-results">
                </div>

                <div nz-col [nzXs]="24" [nzSm]="12" [nzMd]="8" [nzLg]="6" *ngFor="let producto of filteredProducts">
                    <nz-card [nzHoverable]="true" class="store-product-card" [nzCover]="coverTemplate">
                        <ng-template #coverTemplate>
                            <img [alt]="producto.prov_name" [src]="producto.prov_image" class="store-product-card-image"
                                default="assets/img/no-image.png" />
                        </ng-template>

                        <nz-card-meta class="store-product-body" [nzTitle]="producto.prov_name"
                            [nzDescription]="'Ref: ' + producto.prov_uuid"></nz-card-meta>

                        <div class="store-product-actions">
                            <button nz-button nzType="default" (click)="consultarPrecio(producto)">Consultar
                                Precio</button>
                            <button nz-button nzType="primary" (click)="agregarAlCarrito(producto)">
                                <span nz-icon nzType="shopping-cart"></span> Agregar
                            </button>
                        </div>
                    </nz-card>
                </div>
            </div>
        </nz-content>
    </nz-layout>

</div>

<ng-template #notFound>
    <div class="store-not-found-container">
        <h1>Tienda No Disponible</h1>
        <p>Parece que la URL es incorrecta o la tienda no existe.</p>
        <button nz-button nzType="primary" routerLink="/">Volver al Mercado Global</button>
    </div>
</ng-template>
