<div class="market-container">

    <section class="hero-section">
        <div class="hero-content">
            <h1 nz-typography>ATS Market</h1>
            <p nz-typography nzType="secondary">Encuentra los mejores productos de santería y arte sacro en un solo
                lugar.</p>

            <div class="global-search-bar">
                <nz-input-group nzSize="large" [nzAddOnBefore]="selectBefore" [nzSuffix]="suffixIcon">
                    <input type="text" nz-input [(ngModel)]="searchGlobal"
                        placeholder="Busca productos en todas las tiendas..." (keyup.enter)="onGlobalSearch()" />
                </nz-input-group>
                <ng-template #selectBefore>
                    <nz-select [(ngModel)]="itemSelected" style="width: 180px;">
                        <nz-option *ngFor="let globalItem of globalItems" [nzLabel]="globalItem.gitm_name"
                            [nzValue]="globalItem.gitm_uuid"></nz-option>
                    </nz-select>
                </ng-template>
                <ng-template #suffixIcon>
                    <span nz-icon nzType="search" (click)="onGlobalSearch()"></span>
                </ng-template>
            </div>
        </div>
    </section>

    <section class="section-padding categories-section">
        <div class="section-header">
            <h2 nz-typography>Explora por Categoría</h2>
            <a class="view-all">Ver todas <span nz-icon nzType="arrow-right"></span></a>
        </div>

        <div nz-row [nzGutter]="[16, 16]" class="category-grid">
            <div nz-col [nzXs]="8" [nzSm]="6" [nzMd]="4" [nzLg]="3" *ngFor="let cat of globalCategories | slice:1">
                <div class="category-card" (click)="filterByCategory(cat.gcat_uuid)">
                    <nz-avatar [nzSize]="64" [nzSrc]="cat.gcat_image" [nzIcon]="!cat.gcat_image ? 'appstore' : ''"
                        class="category-icon">
                    </nz-avatar>
                    <span class="category-name">{{ cat.gcat_name }}</span>
                </div>
            </div>
        </div>
    </section>

    <section class="section-padding">
        <h2 nz-typography>Tiendas más visitadas</h2>
        <div nz-row [nzGutter]="[24, 24]">
            <div nz-col [nzXs]="24" [nzSm]="12" [nzMd]="6" *ngFor="let store of featuredStores">

                <nz-card [nzHoverable]="true" class="store-card" (click)="goToStore(store.cmp_slug)">
                    <div class="store-card-content">
                        <nz-avatar [nzSize]="80" [nzSrc]="store.cmp_logo"></nz-avatar>
                        <h3>{{ store.cmp_name }}</h3>
                        <!-- TODO: Ver rubro de tienda -->
                        <!-- <p>{{ store.rubroPersonalizado }}</p> -->
                        <button nz-button nzType="primary" nzGhost>Visitar Tienda</button>
                    </div>
                </nz-card>
            </div>
        </div>
    </section>

    <section class="section-padding bg-light">
        <h2 nz-typography>Productos Tendencia</h2>
        <div nz-row [nzGutter]="[16, 16]">
            <div nz-col [nzXs]="12" [nzSm]="12" [nzMd]="6" [nzLg]="6" *ngFor="let prod of productosGlobales">
                <nz-card [nzCover]="coverTemplate" [nzHoverable]="true" [nzActions]="[actionView]">
                    <nz-card-meta [nzTitle]="prod.prov_name"
                        [nzDescription]="'Vendido por: Tienda ' + prod.prov_uuid"></nz-card-meta>
                    <ng-template #coverTemplate>
                        <img class="prod-img" [alt]="prod.prov_name" [src]="prod.prov_image" />
                    </ng-template>
                    <ng-template #actionView>
                        <span class="price-tag">${{ prod.prov_suggestedminimumsellingprice }}</span>
                    </ng-template>
                </nz-card>
            </div>
        </div>
    </section>
</div>
