<nz-header class="app-header" [style.backgroundColor]="navbarColor">
    <div class="logo">
        <a [routerLink]="activeStore ? '/public/home-store/' + activeStore.cmp_slug : '/public/market-home'">
            <img *ngIf="storeLogoUrl" [src]="storeLogoUrl" [alt]="storeName" class="logo-image" />
            <span *ngIf="!storeLogoUrl" nz-icon nzType="shop" nzTheme="outline"></span>
            <span class="site-title">{{ storeName }}</span>
        </a>
    </div>

    <div class="search-container">
        <nz-input-group [nzAddOnBefore]="searchIcon">
            <ng-template #searchIcon><span nz-icon nzType="search"></span></ng-template>
            <input type="text" nz-input placeholder="Buscar rosarios, medallas, santos..."
                (ngModelChange)="onSearchInputChange($event)" />
        </nz-input-group>
    </div>

    <ul nz-menu nzTheme="dark" nzMode="horizontal" class="header-menu desktop-menu">
        <li nz-menu-item routerLink="/user/cart" nzMatchRouter>
            <nz-icon nzType="shopping-cart"></nz-icon> <span>Carrito</span>
            <nz-badge [nzCount]="(cartItems$ | async)?.length || 0" [nzShowZero]="false"></nz-badge>
        </li>

        <!-- Separador visual estético -->
        <li nz-menu-item style="pointer-events: none; padding: 0 8px;">|</li>

        <!-- OPCIONES DE USUARIO -->
        <li nz-menu-item *ngIf="!userIdentity" routerLink="/auth/login">
            <span nz-icon nzType="user"></span> Ingresar
        </li>

        <li nz-menu-item *ngIf="userIdentity" nz-dropdown [nzDropdownMenu]="userMenu" nzPlacement="bottomRight" style="padding: 0 16px;">
            <div style="display: flex; align-items: center; gap: 8px;">
                <nz-avatar nzIcon="user" nzSize="small" nzSrc="assets/img/user-avatar.png"></nz-avatar>
                <span>Hola, {{ userIdentity.usr_name || userIdentity.usr_user }}</span>
            </div>
        </li>

        <nz-dropdown-menu #userMenu="nzDropdownMenu">
            <ul nz-menu>
                <li nz-menu-item routerLink="/application/my-companies" style="color: black;">
                    <span nz-icon nzType="shop" style="margin-right: 8px;"></span> Administrar Tiendas
                </li>
                <li nz-menu-divider></li>
                <li nz-menu-item nzDanger (click)="logout()">
                    <span nz-icon nzType="logout" style="margin-right: 8px;"></span> Cerrar sesión
                </li>
            </ul>
        </nz-dropdown-menu>
    </ul>

    <button nz-button class="menu-toggle-button" nzType="default" (click)="openDrawer()">
        <span nz-icon nzType="menu"></span>
    </button>
</nz-header>

<nz-drawer [nzVisible]="drawerVisible" nzPlacement="right" nzTitle="Menú" (nzOnClose)="closeDrawer()">
    <ng-container *nzDrawerContent>
        <ul nz-menu nzMode="inline" nzTheme="dark" class="mobile-menu">
            <li nz-menu-item routerLink="/public/home" (click)="closeDrawer()">
                <nz-icon nzType="home"></nz-icon> Inicio
            </li>
            <li nz-menu-item routerLink="/public/catalog" (click)="closeDrawer()">
                <nz-icon nzType="appstore"></nz-icon> Catálogo
            </li>
            <li nz-menu-item routerLink="/user/cart" (click)="closeDrawer()">
                <nz-icon nzType="shopping-cart"></nz-icon> Carrito
                <nz-badge [nzCount]="(cartItems$ | async)?.length || 0" [nzShowZero]="false"
                    class="mobile-badge"></nz-badge>
            </li>

            <li nz-menu-divider></li>

            <li nz-menu-item *ngIf="!userIdentity" routerLink="/auth/login" (click)="closeDrawer()">
                <span nz-icon nzType="login"></span> Iniciar Sesión / Regístrate
            </li>

            <li nz-submenu *ngIf="userIdentity"
                [nzTitle]="'Cuenta: ' + (userIdentity.usr_name || userIdentity.usr_user)">
                <ul>
                    <li nz-menu-item routerLink="/application/my-companies" (click)="closeDrawer()">
                        <span nz-icon nzType="shop" style="margin-right: 8px;"></span> Mis Tiendas (Administrar)
                    </li>
                    <li nz-menu-item nzDanger (click)="logout(); closeDrawer()">
                        <span nz-icon nzType="logout" style="margin-right: 8px;"></span> Cerrar sesión
                    </li>
                </ul>
            </li>
        </ul>
    </ng-container>
</nz-drawer>
